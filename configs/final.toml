# E7 — 제출용 학습
# 후보 하나를 train_until 이전 전체 데이터(모든 종목, 20종목 묶음으로 교차 feature 계산)로 학습해
# artifacts/pipeline.pkl (+ pipeline.json) 로 저장. 연구용 feature 를 쓰면 저장하지 않음
# 실행: python -m exp export configs/final.toml --candidate final
# 확인: python main.py check --split 2026-06-01

name = "final"
stage = "E7"
seed = 20261005

[data]
groups = ["core", "scale", "cross", "event", "regime"]

[export]
train_until = "2100-01-01"       # 전체 기간. lockbox 평가(E6) 전에는 export 가 거부함 (exp/lockbox.py)

# 2026-10-12: 최종 모델 = 팀원 E5 B2_vol5 (configs/e5_vol5.toml). M6 사전 등록 규칙(seed 5개 모두 Δ>0)을 통과
#   기존 seed 5개 + 새 seed 5개 = 10/10 양수 (평균 약 +0.007). lockbox 사용 이후 DEV 근거 결정 (lockbox 재평가 없음)
#   실행: python -m exp export configs/final.toml --candidate final_vol5
[[candidates]]
name = "final_vol5"              # = E5 B2_vol5
signal = { type = "gap" }
decision = { type = "k" }
regime = { type = "tercile", params = { var = "vol5" } }

# (이전) E6 판정 규칙에 따라 둘 중 하나를 --candidate 로 고름
#   lockbox Δ(final − baseline) ≥ 0 → --candidate final
#   lockbox Δ < 0                   → --candidate baseline
[[candidates]]
name = "final"                   # = E5 T1-vol = E6 final
signal = { type = "gap" }
decision = { type = "k" }
regime = { type = "tercile", params = { var = "reg_med_vol20" } }

[[candidates]]
name = "baseline"                # = E1 B2 = E6 baseline
signal = { type = "gap" }
decision = { type = "k" }
