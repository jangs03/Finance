# M1 — 모델 계열 비교: XGBoost · LSTM vs 갭 규칙(B2) · HGB
# 질문: 트리 부스팅(XGBoost)이나 시계열 딥러닝(LSTM)이 갭 규칙보다 나은가?
#   - 같은 feature 에서 HGB ↔ XGBoost 를 비교해 "모델 차이"와 "feature 차이"를 분리
#   - seq = 직전 20 거래일 (수익률, 일중 범위) 시퀀스. LSTM 은 이것을 시퀀스로, XGBoost 는 평평한 열 40개로 씀
#   - 결정 규칙은 모두 학습 구간에서 고르는 k (회귀 신호라 k 상한 16), 분류 신호는 4t
# lockbox 사용 후 실험이라 Holm 보정 (family_size = 비기준선 후보 수)
# 2026-10-11 추가: GRU 후보 2개 (LSTM 과 같은 입력·head·학습, 순환 셀만 GRU). family_size 7 → 9
# 실행: uv run python -m exp run configs/m1_models.toml   (xgboost·torch 는 uv 환경에만 있음)

name = "m1_models"
stage = "M1"
seed = 20261011

[data]
groups = ["core", "scale", "cross", "seq"]

[eval]
baseline = "B2"
multiplicity = "holm"
family_size = 9

[[candidates]]
name = "B2"
signal = { type = "gap" }
decision = { type = "k" }

# ---- 트리 부스팅: HGB(기존) vs XGBoost, 같은 feature
[[candidates]]
name = "HGB-core"
signal = { type = "regress", features = ["core"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "XGB-core"
signal = { type = "xgb_reg", features = ["core"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "XGB-price"
signal = { type = "xgb_reg", features = ["core", "scale", "cross", "seq"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "XGB-cls5"
signal = { type = "xgb_cls5", features = ["core", "scale", "seq"] }
decision = { type = "4t" }

# ---- 시계열 딥러닝
[[candidates]]
name = "LSTM-seq+core"
signal = { type = "lstm", features = ["seq", "core"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "LSTM-seq+price"
signal = { type = "lstm", features = ["seq", "core", "scale"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "LSTM-seq"
signal = { type = "lstm", features = ["seq"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "GRU-seq+core"
signal = { type = "gru", features = ["seq", "core"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }

[[candidates]]
name = "GRU-seq+price"
signal = { type = "gru", features = ["seq", "core", "scale"] }
decision = { type = "k", params = { k_grid = [0.5, 16.0, 0.25] } }
